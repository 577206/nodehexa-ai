features:
- id: fixed_hood
  intent: one fixed open-bottom inverted-bowl cover enclosing central robot board
    and wiring
  open_direction: -Z
  envelope: 86x86 lower outside,82x82 roof outside; internal minimum76x76, ceilingZ24;
    screws occupy only approved8mm corridors
- id: two_recessed_screw_wells
  intent: two top-access wells leading down to local screw seats near original frame;
    do not pass a 10mm screw through the whole hood height
  placement: X=+/-28.5020684,Y=0; reference-derived, retain original holes
  seat_type: 'cylindrical pan-head seat: bore5.2, shaft2.4, remaining local bearing
    thickness2.4;8mm outer corridor'
  quantity: 2
- id: connector_pocket
  intent: top recessed keyed pocket supporting magnetic connector housing; tail opening
    into hollow interior; adhesive lands outside contact face
  profile: capsule-envelope glue seat20.0x4.5; not a reverse-engineered exact ear
    profile;12x2.4 tail opening
  seat_height: pocket floorZ25, nominal faceZ29; one mm floor above cavity except
    tail opening
- id: head_keyed_nest
  intent: complementary loose-fit locating rim/key, not interference fit; magnets
    provide separation retention, shoulder/rim carry compression and shear
  release: vertical lift, no mechanical latch per user
  dimensions: outer76x76, inner72x72 rim fromZ27to29; asymmetrical key at+Y; upper
    complementary part deferred
- id: wire_exit
  intent: three wires run in hollow cavity to12x2.4 tail opening; no power rail; under-skirt
    external exits not dimensioned until actual cable route
  pinout: GND/TX/RX; mapping explicitly pending final wiring check
constraints:
  formal: []
  narrative:
  - Do not change or drill original frame; use exactly its two cover holes
  - Two screws fix only the hood to chassis, never the detachable head
  - User requested magnetic-only head retention; no latch
  - Bottom remains open; do not create a full lower floor
  - Preserve servo pockets, local widths and joint interfaces
  - Keep both power supplies independent; no battery/power rail through the 3 signal
    wires
  - Glue only connector housing support lands, not pins, springs or contact face
  - Do not infer actual robot heights or cover width from perspective photos
