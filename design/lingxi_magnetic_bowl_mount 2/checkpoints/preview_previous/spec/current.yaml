placements: {}
features:
- id: fixed_hood
  intent: one fixed open-bottom inverted-bowl cover enclosing central robot board
    and wiring
  open_direction: -Z
  envelope: not dimensioned until electronics clearance and coverage confirmed
- id: two_recessed_screw_wells
  intent: two top-access wells leading down to local screw seats near original frame;
    do not pass a 10mm screw through the whole hood height
  placement: X=+/-28.5020684,Y=0; reference-derived, retain original holes
  seat_type: awaiting head type; conical countersink only for conical heads, cylindrical
    counterbore for pan/button heads
  quantity: 2
- id: connector_pocket
  intent: top recessed keyed pocket supporting magnetic connector housing; tail opening
    into hollow interior; adhesive lands outside contact face
  profile: stepped capsule/ear outline per image; verify purchased variant
  seat_height: 'pending: connector mating plane and spring travel determine final
    exposure'
- id: head_keyed_nest
  intent: complementary loose-fit locating rim/key, not interference fit; magnets
    provide separation retention, shoulder/rim carry compression and shear
  release: vertical lift, no mechanical latch per user
  dimensions: pending
- id: wire_exit
  intent: three-wire route from robot board into connector rear; strain relief and
    solder clearance; fourth contact spare
  pinout: GND/TX/RX; mapping explicitly pending final wiring check
constraints:
  formal: []
  narrative:
  - Do not change or drill original frame; use exactly its two cover holes
  - Two screws fix only the hood to chassis, never the detachable head
  - User requested magnetic-only head retention; no latch
  - Bottom remains open; do not create a full lower floor
  - Preserve servo pockets, local widths and joint interfaces
  - Keep both power supplies independent; no battery/power rail through the 3 signal
    wires
  - Glue only connector housing support lands, not pins, springs or contact face
  - Do not infer actual robot heights or cover width from perspective photos
decisions:
- date: '2026-10-31'
  status: user_confirmed
  decision: Body widening remains total50mm; red/black palette; fixed hood mounts
    to existing two holes; magnetic-only detachable head; 4-contact connector uses3
    wires
- status: dimensioned_image_reference
  connector:
    full_outline_length_mm: 19.54
    full_outline_length_tolerance_mm: 0.1
    secondary_length_mm: 17.54
    secondary_length_tolerance_mm: 0.05
    face_width_mm: 4.0
    face_width_tolerance_mm: 0.08
    contact_pitch_mm: 2.54
    contact_pitch_tolerance_mm: 0.05
    housing_height_shown_mm: 4.0
    tail_projection_shown_mm: 1.5
  note: 19.54 and17.54 dimension different profile levels; not interchangeable rectangle
    sizes; no pocket dimensions frozen
validation_targets:
  dimensions:
    hole_center_distance_mm: 57.00413680076599
  clearances:
    electronics: must exceed measured envelope; value pending
    head_nest: positive assembly clearance; no zero-clearance or press fit
    screw_engagement: calculate from actual head/seat/threaded destination, not nominal
      screw length alone
  features:
    hood: one closed solid with open lower cavity
    screw_wells: both driver access paths clear
    connector: glue support and tail access; mating faces and compression stroke unobstructed
    motion: no collision with leg sweeps; not yet verified
