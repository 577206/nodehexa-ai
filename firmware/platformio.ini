; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s, nodequadmini, nodehexa-v2, nodequadmini-v2

[env:nodemcu-32s]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dio
upload_port = COM[3]
monitor_port = COM[3]
monitor_speed = 115200
build_type = debug
build_flags = 
    -D FIRMWARE_VERSION="3.0.1"
lib_deps = 
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  SPI

[env:nodequadmini]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dio
upload_port = COM[3]
monitor_port = COM[3]
monitor_speed = 115200
build_type = debug
build_flags =
    -D FIRMWARE_VERSION="3.0.1"
    -D ROBOT_MODEL_NODEQUADMINI
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  SPI

[env:nodehexa-v2]
extends = env:nodemcu-32s
build_flags =
    ${env:nodemcu-32s.build_flags}
    -D NODEHEXA_HARDWARE_REVISION=2

; USB bench integration: keep UART/Wi-Fi active while all servo PWM is disabled.
; Not included in default_envs so release firmware behavior stays unchanged.
[env:nodehexa-bench]
extends = env:nodemcu-32s
build_flags =
    ${env:nodemcu-32s.build_flags}
    -D NODEHEXA_BENCH_MODE

[env:nodehexa-v2-bench]
extends = env:nodehexa-v2
build_flags =
    ${env:nodehexa-v2.build_flags}
    -D NODEHEXA_BENCH_MODE

; EDGE50 +25 mm per side. Geometry integration only; servo PWM remains disabled.
; Physical assembly and loaded motion have not been approved for this chassis.
[env:nodehexa-edge50-bench]
extends = env:nodehexa-v2-bench
; Existing LEDC and WebServer code targets Arduino-ESP32 2.x.
platform = espressif32@6.9.0
build_flags =
    ${env:nodehexa-v2-bench.build_flags}
    -D NODEHEXA_CHASSIS_EDGE50

[env:nodequadmini-v2]
extends = env:nodequadmini
build_flags =
    ${env:nodequadmini.build_flags}
    -D NODEHEXA_HARDWARE_REVISION=2
