<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <style type="text/css">
    .title {
      text-align: center;
      position: relative;
      font-size: 32px;
      margin: 20px 0;
    }
    .lang-switch {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #1E90FF;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px #999;
      transition: all 0.3s;
    }
    .lang-switch:hover {
      background-color: #0b7dda;
    }
    .lang-switch:active {
      box-shadow: 0 2px #666;
      transform: translateY(-48%);
    }
    
    .quantity {
      width: 40px;
      height: 28px;
      text-align: center;
      font-size: 14px;
    }
    
    button {
      color: black;
      background: lightblue;
      border: 2px solid #000;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background: #87CEEB;
    }
    
    .control-buttons {
      text-align: center;
      margin: 20px 0;
    }
    
    .control-buttons button {
      width: 200px;
      height: 40px;
      margin: 0 10px;
      font-size: 16px;
      font-weight: bold;
    }
    
    .leg-group {
      display: inline-block;
      margin: 6px;
      padding: 3px;
      border: 1px solid #fc0;
      border-radius: 6px;
      background-color: #fffaf0;
      vertical-align: top;
      white-space: nowrap;
    }
    
    .leg-label {
      display: block;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 4px;
      color: #333;
    }
    
    .joint-control {
      display: inline-block;
      margin: 1px;
      padding: 1px;
      background-color: white;
      border-radius: 3px;
      vertical-align: top;
    }
    
    .joint-label {
      display: block;
      font-size: 10px;
      color: #666;
      margin-bottom: 2px;
    }
    
    input[type="button"] {
      width: 26px;
      height: 26px;
      font-size: 16px;
      font-weight: bold;
    }
    
    .calibration-container {
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .row {
      margin: 10px 0;
      white-space: nowrap;
      overflow-x: auto;
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      .leg-group {
        min-width: 200px;
        margin: 2px;
        padding: 2px;
      }
      
      .joint-control {
        margin: 0px;
        padding: 0px;
      }
      
      .quantity {
        width: 35px;
        height: 22px;
        font-size: 12px;
      }
      
      input[type="button"] {
        width: 20px;
        height: 20px;
        font-size: 12px;
      }
      
      .leg-label {
        font-size: 11px;
        margin-bottom: 2px;
      }
      
      .joint-label {
        font-size: 9px;
        margin-bottom: 1px;
      }
      
      .row {
        margin: 8px 0;
      }
    }

    /* 项目页脚样式 */
    .footer {
      margin-top: 40px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
    }
    .footer-content {
      max-width: 800px;
      margin: 0 auto;
    }
    .footer-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: nowrap;
      margin-top: 12px;
    }
    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 15px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      transition: all 0.3s;
    }
    .footer-link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .footer-icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <h1 class="title">
    <span id="pageTitle">舵机校准</span>
    <button class="lang-switch" onclick="toggleLanguage()">English</button>
  </h1>
  <div id="powerBadgeMount"></div>

  <div class="calibration-container">
    <div class="control-buttons">
      <button id="CALIBRATESTART" type="button" onclick="buttonclick(this);" data-zh="开始校准" data-en="Start Calibration">开始校准</button>
      <button id="CALIBRATESAVE" type="button" onclick="buttonclick(this);" data-zh="保存并返回" data-en="Save & Return">保存并返回</button>
    </div>

    <!-- 腿部校准区域：四足/六足共用一套 HTML，靠 /api/caps 探针动态渲染 -->
    <div id="legsRoot" class="row" style="padding: 10px 0;">
      正在加载机型信息...
    </div>
  </div>

  <!-- 项目页脚 -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-title" id="footerTitle">灵犀 · 机器人控制</div>
      <div class="footer-links">
        <a href="https://github.com/577206/nodehexa-ai" target="_blank" rel="noopener noreferrer" class="footer-link" title="项目仓库">项目仓库</a>
      </div>
    </div>
  </footer>

<script src="/power_ui.js"></script>
<script>
let robotCaps = { robot: { type: 'hexa', legCount: 6 } };
var webSocketCarInputUrl = "ws:\/\/" + window.location.hostname + "/cmd";
let websocketCarInput;
let powerUi;

function guardLowBattery() {
  return powerUi ? powerUi.guardLowBattery() : false;
}

function initRobotInputWebSocket() {
  websocketCarInput = new WebSocket(webSocketCarInputUrl);
  websocketCarInput.onopen = function() {
    console.log('WebSocket is open now.');
    loadCaps().catch(function() {});
  };
  websocketCarInput.onclose = function() {
    console.log('WebSocket is closed now. Reconnecting...');
    setTimeout(initRobotInputWebSocket, 2000);
  };
  websocketCarInput.onmessage = function(event) {
    try {
      const msg = JSON.parse(event.data);
      if (powerUi && powerUi.handleWsMessage(msg)) {
        return;
      }
    } catch (_) {
      // ignore non-JSON payload
    }
  };
}

async function loadCaps() {
  try {
    const resp = await fetch('/api/caps', { cache: 'no-store' });
    const data = await resp.json();
    if (data && data.robot && typeof data.robot.legCount === 'number') {
      robotCaps = data;
    }
    if (powerUi) powerUi.applyCaps(data);
  } catch (_) {
    // 兜底：保持默认六足布局
  }
}

function getRobotTitleByCaps() {
  const type = (robotCaps && robotCaps.robot && robotCaps.robot.type) ? robotCaps.robot.type : 'hexa';
  if (type === 'quad') return { zh: '灵犀 · 四足校准', en: 'Lingxi · Quadruped Calibration' };
  return { zh: '灵犀 · 六足校准', en: 'Lingxi · Hexapod Calibration' };
}

function getLegLayout() {
  const legCount = (robotCaps && robotCaps.robot && robotCaps.robot.legCount) ? robotCaps.robot.legCount : 6;
  if (legCount === 4) {
    // Quad leg index mapping (from firmware/quad_leg.cpp):
    // 0 = Front Right, 1 = Back Right, 2 = Back Left, 3 = Front Left
    return [
      { legs: [
        { legIndex: 3, zh: '左前腿 (3)', en: 'Left Front (3)' },
        { legIndex: 0, zh: '右前腿 (0)', en: 'Right Front (0)' },
      ]},
      { legs: [
        { legIndex: 2, zh: '左后腿 (2)', en: 'Left Back (2)' },
        { legIndex: 1, zh: '右后腿 (1)', en: 'Right Back (1)' },
      ]},
    ];
  }

  // Hexapod layout (keep original UI order):
  // Left Front (5), Right Front (0), Left Middle (4), Right Middle (1), Left Back (3), Right Back (2)
  return [
    { legs: [
      { legIndex: 5, zh: '左前腿 (5)', en: 'Left Front (5)' },
      { legIndex: 0, zh: '右前腿 (0)', en: 'Right Front (0)' },
    ]},
    { legs: [
      { legIndex: 4, zh: '左中腿 (4)', en: 'Left Middle (4)' },
      { legIndex: 1, zh: '右中腿 (1)', en: 'Right Middle (1)' },
    ]},
    { legs: [
      { legIndex: 3, zh: '左后腿 (3)', en: 'Left Back (3)' },
      { legIndex: 2, zh: '右后腿 (2)', en: 'Right Back (2)' },
    ]},
  ];
}

function renderLegControls() {
  const root = document.getElementById('legsRoot');
  if (!root) return;
  root.innerHTML = '';

  const rows = getLegLayout();
  rows.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';

    row.legs.forEach(leg => {
      const legGroup = document.createElement('span');
      legGroup.className = 'leg-group';

      const legLabel = document.createElement('span');
      legLabel.className = 'leg-label';
      legLabel.setAttribute('data-zh', leg.zh);
      legLabel.setAttribute('data-en', leg.en);
      legLabel.textContent = (currentLang === 'zh') ? leg.zh : leg.en;
      legGroup.appendChild(legLabel);

      for (let partIndex = 0; partIndex < 3; partIndex++) {
        const joint = document.createElement('span');
        joint.className = 'joint-control';

        const jointLabel = document.createElement('span');
        jointLabel.className = 'joint-label';
        jointLabel.setAttribute('data-zh', `关节${partIndex}`);
        jointLabel.setAttribute('data-en', `Joint ${partIndex}`);
        jointLabel.textContent = (currentLang === 'zh') ? `关节${partIndex}` : `Joint ${partIndex}`;
        joint.appendChild(jointLabel);

        const dec = document.createElement('input');
        dec.type = 'button';
        dec.className = 'decrease';
        dec.value = '-';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'quantity';
        input.value = '0';
        input.setAttribute('value', '0');
        input.dataset.legIndex = String(leg.legIndex);
        input.dataset.partIndex = String(partIndex);
        input.addEventListener('change', (e) => {
          const v = parseInt(e.target.value, 10);
          const safe = Number.isFinite(v) ? v : 0;
          e.target.value = safe;
          e.target.setAttribute('value', safe);
          sendData(leg.legIndex, partIndex, safe);
        });

        const inc = document.createElement('input');
        inc.type = 'button';
        inc.className = 'increase';
        inc.value = '+';

        dec.addEventListener('click', () => {
          const v = parseInt(input.value, 10);
          const next = (Number.isFinite(v) ? v : 0) - 1;
          input.value = next;
          input.setAttribute('value', next);
          sendData(leg.legIndex, partIndex, next);
        });
        inc.addEventListener('click', () => {
          const v = parseInt(input.value, 10);
          const next = (Number.isFinite(v) ? v : 0) + 1;
          input.value = next;
          input.setAttribute('value', next);
          sendData(leg.legIndex, partIndex, next);
        });

        joint.appendChild(dec);
        joint.appendChild(input);
        joint.appendChild(inc);
        legGroup.appendChild(joint);
      }

      rowDiv.appendChild(legGroup);
    });

    root.appendChild(rowDiv);
  });
}

async function postCalibrationPayload(payload, onSuccess) {
  if (guardLowBattery()) return false;
  try {
    const resp = await fetch('/calibration', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data && data.status === 'error') {
      if (powerUi && powerUi.handleHttpErrorMessage(data.message)) {
        return 'handled-low-battery';
      }
      return false;
    }
    if (typeof onSuccess === 'function') {
      onSuccess(data);
    }
    return true;
  } catch (_) {
    return false;
  }
}

async function sendData(legIndex, partIndex, offset) {
  var intOffset = parseInt(offset, 10);
  var data = {
    legIndex: legIndex,
    partIndex: partIndex,
    offset: intOffset,
    modeChanged: false
  };
  await postCalibrationPayload(data);
}

async function buttonclick(e) {
  if (guardLowBattery()) return false;
  if (e.id === 'CALIBRATESTART') {
    // 开始校准：先检查是否存在已保存的校准配置
    await handleStartCalibration();
    return false;
  }

  if (e.id === 'CALIBRATESAVE') {
    const ok = await postCalibrationPayload({
      modeChanged: true,
      operation: e.id
    });
    if (ok) {
      window.location.href = '/';
    } else if (ok !== 'handled-low-battery') {
      alert(currentLang === 'zh' ? '保存失败，请重试' : 'Save failed, please try again');
    }
    return false;
  }

  var data = {
    modeChanged: true,
    operation: e.id
  };
  await postCalibrationPayload(data);
  return false;
}

// 处理“开始校准”的选择逻辑
async function handleStartCalibration() {
  if (guardLowBattery()) return false;
  try {
    const resp = await fetch('/api/calibration');
    const data = await resp.json();
    if (data && data.exists) {
      // 弹框：确定=重新校准(清零)，取消=基于已有数据
      const isReset = confirm('检测到已保存的校准数据。\n“确定”重新校准（清零），“取消”沿用已有数据。');
      if (isReset) {
        return postCalibrationOperation('CALIBRATESTART', function() {
          resetUIOffsetsToZero();
        });
      }
      return postCalibrationOperation('CALIBRATESTART_EXISTING', function() {
        if (data.offsets) {
          applyOffsetsToUI(data.offsets);
        }
      });
    }

    // 无已保存配置，直接按原逻辑开始校准
    return postCalibrationOperation('CALIBRATESTART', function() {
      resetUIOffsetsToZero();
    });
  } catch (_) {
    // 兜底：请求失败时按原逻辑处理
    return postCalibrationOperation('CALIBRATESTART', function() {
      resetUIOffsetsToZero();
    });
  }
}

function postCalibrationOperation(operation, onload) {
  return postCalibrationPayload({ modeChanged: true, operation: operation }, onload);
}

function resetUIOffsetsToZero() {
  const inputs = document.getElementsByClassName("quantity");
  for (let i = 0; i < inputs.length; i++) {
    inputs[i].value = 0;
    inputs[i].setAttribute('value', 0);
  }
}

function applyOffsetsToUI(offsetMatrix) {
  const inputs = document.getElementsByClassName("quantity");
  for (let i = 0; i < inputs.length; i++) {
    const el = inputs[i];
    const legIndex = parseInt(el.dataset.legIndex || '0', 10);
    const partIndex = parseInt(el.dataset.partIndex || '0', 10);
    const value =
      (offsetMatrix &&
        offsetMatrix[legIndex] &&
        offsetMatrix[legIndex][partIndex] != null)
        ? offsetMatrix[legIndex][partIndex]
        : 0;
    el.value = value;
    el.setAttribute('value', value);
  }
}

// 语言切换功能
let currentLang = 'zh'; // 默认中文

const langTexts = {
  pageTitle: { zh: '舵机校准', en: 'Servo Calibration' },
  langButton: { zh: 'English', en: '中文' },
  footerTitle: { zh: '灵犀 · 机器人控制', en: 'Lingxi · Robot Control' },
};

function toggleLanguage() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  
  // 更新页面标题
  document.getElementById('pageTitle').textContent = langTexts.pageTitle[currentLang];
  
  // 更新语言切换按钮文本
  document.querySelector('.lang-switch').textContent = langTexts.langButton[currentLang];
  
  // 更新所有带data-zh和data-en属性的元素
  const elements = document.querySelectorAll('[data-zh][data-en]');
  elements.forEach(element => {
    element.textContent = element.getAttribute('data-' + currentLang);
  });
  
  // 更新页脚文本
  document.getElementById('footerTitle').textContent = langTexts.footerTitle[currentLang];
  if (powerUi) powerUi.render();
  
  console.log('Language switched to: ' + (currentLang === 'zh' ? '中文' : 'English'));
}

// 页面加载时默认显示中文
window.onload = async function() {
  powerUi = createPowerUi({
    mountId: 'powerBadgeMount',
    getLang: () => currentLang,
    alertFn: alert
  });
  powerUi.render();
  initRobotInputWebSocket();
  // 1) 拉取机型探针并渲染腿部 UI
  await loadCaps();
  powerUi.startPolling(10000);
  const title = getRobotTitleByCaps();
  langTexts.footerTitle = title;
  document.getElementById('footerTitle').textContent = title[currentLang];

  renderLegControls();

  // 2) 默认显示中文（不主动切换语言）
};
</script>
</body>
</html>
